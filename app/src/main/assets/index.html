<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxing Coach Pro 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #070b14;
            --panel: #111827;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --danger: #ef4444;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }
        header { text-align: center; margin-bottom: 6px; }
        header h1 { font-size: 1.1rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .app-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
        
        #canvas-3d { width: 100%; height: 260px; background: radial-gradient(circle at 50% 40%, #1e293b 0%, #090d16 100%); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(0,0,0,0.6); position: relative; overflow: hidden; }

        .panel { background: var(--panel); border-radius: 16px; padding: 14px; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .status-board { display: flex; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
        .timer-sec { text-align: center; margin: 4px 0; }
        .timer-sec h2 { font-size: 2.5rem; font-weight: 900; color: var(--text); text-shadow: 0 0 15px var(--accent-glow); }
        
        .combo-box { background: rgba(245, 158, 11, 0.05); border: 2px dashed var(--accent); border-radius: 12px; padding: 12px; text-align: center; min-height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .combo-box h3 { font-size: 1.45rem; color: var(--accent); font-weight: 900; letter-spacing: 0.5px; }
        .combo-box p { font-size: 0.75rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; }

        .controls { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        button { background: var(--accent); color: #000; border: none; padding: 12px; font-size: 0.95rem; font-weight: 800; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        button:active { transform: scale(0.97); }
        button.secondary { background: #1f2937; color: var(--text); border: 1px solid var(--border); }

        .settings { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: var(--muted); }
        .row { display: flex; justify-content: space-between; align-items: center; }
        select, input { background: #1f2937; border: 1px solid var(--border); color: white; padding: 5px 8px; border-radius: 6px; outline: none; }
    </style>
</head>
<body>

    <header><h1>Boxing Coach Pro • 3D Flow</h1></header>

    <div class="app-container">
        <div id="canvas-3d"></div>

        <div class="panel">
            <div class="status-board">
                <span id="round-txt">Round 1 / 3</span>
                <span style="color: var(--accent);">Stance: Orthodox</span>
            </div>
            <div class="timer-sec"><h2 id="timer-display">03:00</h2></div>
            <div class="combo-box">
                <h3 id="combo-text">READY</h3>
                <p id="combo-sub">Follow 3D Boxer & Audio</p>
            </div>
        </div>

        <div class="panel settings">
            <div class="row">
                <label>Rounds / Duration:</label>
                <div>
                    <select id="rounds-select"><option value="3">3R</option><option value="5">5R</option><option value="12">12R</option></select>
                    <select id="time-select"><option value="180">3m</option><option value="120">2m</option></select>
                </div>
            </div>
            <div class="row">
                <label>Combo Speed:</label>
                <input type="range" id="speed-range" min="2.5" max="5.5" value="3.8" step="0.3">
            </div>
        </div>

        <div class="controls">
            <button id="start-btn">Start Session</button>
            <button class="secondary" onclick="location.reload()">Reset</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, boxerRoot, upperBody, headGroup;
        let leftShoulder, leftElbow, rightShoulder, rightElbow;
        let activeAction = null;
        let actionProgress = 0;

        function createLimb(radiusTop, radiusBottom, length, material) {
            const geom = new THREE.CylinderGeometry(radiusTop, radiusBottom, length, 16);
            geom.translate(0, -length / 2, 0);
            return new THREE.Mesh(geom, material);
        }

        function init3D() {
            const container = document.getElementById('canvas-3d');
            if (typeof THREE === 'undefined') return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0.35, 1.45, 3.1);
            camera.lookAt(0, 1.15, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // إضاءة سينمائية تبرز العضلات والقفازات
            scene.add(new THREE.AmbientLight(0xffffff, 0.55));
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
            keyLight.position.set(2, 4, 3);
            scene.add(keyLight);
            const rimLight = new THREE.PointLight(0xf59e0b, 1.4, 8);
            rimLight.position.set(-2, 2.2, -1.5);
            scene.add(rimLight);

            // أرضية الحلبة
            const ringFloor = new THREE.Mesh(
                new THREE.CircleGeometry(1.4, 32),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
            );
            ringFloor.rotation.x = -Math.PI / 2;
            scene.add(ringFloor);

            // الخامات (بشرة رياضية، شورت ملاكمة، قفازات حمراء)
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd99b66, roughness: 0.45 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6 });
            const beltMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3 });
            const gloveMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.25, metalness: 0.1 });
            const bootMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.5 });

            boxerRoot = new THREE.Group();
            boxerRoot.rotation.y = -0.38; // زاوية وقفة الملاكم Orthodox
            scene.add(boxerRoot);

            // الحوض والشورت الرياضي
            const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.23, 0.28, 18), shortsMat);
            pelvis.position.y = 0.92;
            boxerRoot.add(pelvis);

            const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.215, 0.06, 18), beltMat);
            belt.position.y = 1.05;
            boxerRoot.add(belt);

            // الأرجل (وقفة متزنة: اليسرى للأمام واليمنى للخلف)
            const leftLeg = createLimb(0.11, 0.075, 0.85, skinMat);
            leftLeg.position.set(-0.13, 0.88, 0.18);
            leftLeg.rotation.x = -0.18;
            boxerRoot.add(leftLeg);

            const leftBoot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.26), bootMat);
            leftBoot.position.set(0, -0.82, 0.05);
            leftLeg.add(leftBoot);

            const rightLeg = createLimb(0.11, 0.075, 0.85, skinMat);
            rightLeg.position.set(0.14, 0.88, -0.18);
            rightLeg.rotation.x = 0.22;
            boxerRoot.add(rightLeg);

            const rightBoot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.26), bootMat);
            rightBoot.position.set(0, -0.82, 0.05);
            rightLeg.add(rightBoot);

            // الجذع العلوي والعضلات
            upperBody = new THREE.Group();
            upperBody.position.y = 1.06;
            boxerRoot.add(upperBody);

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.19, 0.52, 20), skinMat);
            torso.position.y = 0.26;
            torso.scale.set(1.15, 1, 0.78);
            upperBody.add(torso);

            // الرأس والرقبة
            headGroup = new THREE.Group();
            headGroup.position.set(0, 0.54, 0.03);
            upperBody.add(headGroup);

            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.12, 14), skinMat);
            neck.position.y = 0.04;
            headGroup.add(neck);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.145, 20, 20), skinMat);
            head.scale.set(0.92, 1.12, 1.02);
            head.position.y = 0.2;
            headGroup.add(head);

            // الذراع اليسرى (Lead Arm - Jab / Hook)
            leftShoulder = new THREE.Group();
            leftShoulder.position.set(-0.31, 0.46, 0.04);
            upperBody.add(leftShoulder);

            const lUpperArm = createLimb(0.075, 0.062, 0.30, skinMat);
            leftShoulder.add(lUpperArm);

            leftElbow = new THREE.Group();
            leftElbow.position.set(0, -0.30, 0);
            leftShoulder.add(leftElbow);

            const lForearm = createLimb(0.06, 0.05, 0.27, skinMat);
            leftElbow.add(lForearm);

            const leftGlove = new THREE.Mesh(new THREE.SphereGeometry(0.105, 16, 16), gloveMat);
            leftGlove.scale.set(0.95, 1.15, 1.2);
            leftGlove.position.set(0, -0.29, 0.02);
            leftElbow.add(leftGlove);

            // الذراع اليمنى (Rear Arm - Cross / Uppercut)
            rightShoulder = new THREE.Group();
            rightShoulder.position.set(0.31, 0.46, -0.02);
            upperBody.add(rightShoulder);

            const rUpperArm = createLimb(0.075, 0.062, 0.30, skinMat);
            rightShoulder.add(rUpperArm);

            rightElbow = new THREE.Group();
            rightElbow.position.set(0, -0.30, 0);
            rightShoulder.add(rightElbow);

            const rForearm = createLimb(0.06, 0.05, 0.27, skinMat);
            rightElbow.add(rForearm);

            const rightGlove = new THREE.Mesh(new THREE.SphereGeometry(0.105, 16, 16), gloveMat);
            rightGlove.scale.set(0.95, 1.15, 1.2);
            rightGlove.position.set(0, -0.29, 0.02);
            rightElbow.add(rightGlove);

            setGuardPose();
            animate3D();
        }

        // وضعية الدفاع الأساسية (Guard)
        function setGuardPose() {
            upperBody.rotation.set(0.08, 0, 0);
            upperBody.position.set(0, 1.06, 0);
            headGroup.rotation.set(0.12, 0.32, 0);

            leftShoulder.rotation.set(-0.65, 0.15, -0.22);
            leftElbow.rotation.set(-2.05, 0, 0.25);

            rightShoulder.rotation.set(-0.55, -0.15, 0.22);
            rightElbow.rotation.set(-2.25, 0, -0.25);
        }

        function triggerMove3D(moveType) {
            activeAction = moveType;
            actionProgress = 0;
        }

        function updatePose(type, t) {
            // منحنى حركة سلس ذهاباً وإياباً (0 -> 1 -> 0)
            const wave = Math.sin(t * Math.PI);
            setGuardPose();

            if (type === 'JAB') {
                upperBody.rotation.y = 0.28 * wave;
                leftShoulder.rotation.x = -0.65 - 0.85 * wave;
                leftShoulder.rotation.z = -0.22 + 0.22 * wave;
                leftElbow.rotation.x = -2.05 + 1.95 * wave;
            } else if (type === 'CROSS') {
                upperBody.rotation.y = -0.45 * wave;
                upperBody.rotation.x = 0.08 + 0.12 * wave;
                rightShoulder.rotation.x = -0.55 - 0.95 * wave;
                rightShoulder.rotation.z = 0.22 - 0.22 * wave;
                rightElbow.rotation.x = -2.25 + 2.15 * wave;
            } else if (type === 'HOOK') {
                upperBody.rotation.y = -0.42 * wave;
                leftShoulder.rotation.x = -0.65 - 0.85 * wave;
                leftShoulder.rotation.z = -0.22 - 0.95 * wave;
                leftElbow.rotation.x = -2.05 + 0.55 * wave;
            } else if (type === 'UPPERCUT') {
                upperBody.position.y = 1.06 - 0.06 * wave;
                upperBody.rotation.y = -0.35 * wave;
                rightShoulder.rotation.x = -0.55 - 0.85 * wave;
                rightElbow.rotation.x = -2.25 + 0.75 * wave;
            } else if (type === 'SLIP_LEFT') {
                upperBody.rotation.z = -0.35 * wave;
                upperBody.rotation.x = 0.22 * wave;
                upperBody.position.x = -0.12 * wave;
            } else if (type === 'SLIP_RIGHT') {
                upperBody.rotation.z = 0.35 * wave;
                upperBody.rotation.x = 0.22 * wave;
                upperBody.position.x = 0.12 * wave;
            } else if (type === 'ROLL') {
                upperBody.position.y = 1.06 - 0.22 * wave;
                upperBody.rotation.x = 0.38 * wave;
                upperBody.rotation.z = Math.sin(t * Math.PI * 2) * 0.25;
            }
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (boxerRoot) {
                // حركة ارتداد أقدام الملاكم المستمرة (Bounce)
                const bounce = Math.abs(Math.sin(Date.now() * 0.0055)) * 0.025;
                boxerRoot.position.y = bounce;

                if (activeAction) {
                    actionProgress += 0.055; // سرعة تنفيذ اللكمة
                    if (actionProgress >= 1) {
                        activeAction = null;
                        setGuardPose();
                    } else {
                        updatePose(activeAction, actionProgress);
                    }
                }
            }
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.addEventListener('load', init3D);

        class BoxingProEngine {
            constructor() {
                this.punches = [
                    { label: '1 (Jab)', say: 'Jab', anim: 'JAB' },
                    { label: '2 (Cross)', say: 'Cross', anim: 'CROSS' },
                    { label: '3 (Lead Hook)', say: 'Lead Hook', anim: 'HOOK' },
                    { label: '4 (Rear Uppercut)', say: 'Rear Uppercut', anim: 'UPPERCUT' }
                ];
                this.defenses = [
                    { label: 'Slip Left', say: 'Slip Left', anim: 'SLIP_LEFT' },
                    { label: 'Slip Right', say: 'Slip Right', anim: 'SLIP_RIGHT' },
                    { label: 'Roll', say: 'Roll', anim: 'ROLL' }
                ];
                
                this.isRunning = false;
                this.round = 1;
                this.totalRounds = 3;
                this.roundTime = 180;
                this.restTime = 60;
                this.timeLeft = this.roundTime;
                this.isResting = false;
                this.speed = 3800;
                this.initListeners();
            }

            initListeners() {
                document.getElementById('start-btn').addEventListener('click', () => this.toggle());
                document.getElementById('speed-range').addEventListener('input', (e) => {
                    this.speed = parseFloat(e.target.value) * 1000;
                    if (this.isRunning) {
                        clearInterval(this.loop);
                        this.loop = setInterval(() => this.nextCombo(), this.speed);
                    }
                });
                document.getElementById('rounds-select').addEventListener('change', (e) => {
                    this.totalRounds = parseInt(e.target.value);
                    document.getElementById('round-txt').textContent = `Round ${this.round} / ${this.totalRounds}`;
                });
                document.getElementById('time-select').addEventListener('change', (e) => {
                    this.roundTime = parseInt(e.target.value);
                    if(!this.isRunning) { this.timeLeft = this.roundTime; this.renderTimer(); }
                });
            }

            toggle() {
                if(this.isRunning) { this.stop(); } else { this.start(); }
            }

            start() {
                this.isRunning = true;
                const btn = document.getElementById('start-btn');
                btn.textContent = 'Stop Session';
                btn.style.background = 'var(--danger)';
                btn.style.color = '#fff';

                this.timer = setInterval(() => this.tick(), 1000);
                this.loop = setInterval(() => this.nextCombo(), this.speed);
                this.speak("Round 1. Fight!");
            }

            stop() {
                this.isRunning = false;
                clearInterval(this.timer);
                clearInterval(this.loop);
                const btn = document.getElementById('start-btn');
                btn.textContent = 'Start Session';
                btn.style.background = 'var(--accent)';
                btn.style.color = '#000';
                document.getElementById('combo-text').textContent = 'READY';
            }

            tick() {
                if(this.timeLeft > 0) {
                    this.timeLeft--;
                    this.renderTimer();
                } else {
                    if(!this.isResting) {
                        if(this.round >= this.totalRounds) {
                            this.stop();
                            this.speak("Workout complete!");
                            return;
                        }
                        this.isResting = true;
                        this.timeLeft = this.restTime;
                        document.getElementById('combo-text').textContent = 'REST';
                        document.getElementById('combo-sub').textContent = 'Breathe & recover';
                        this.speak("Rest time.");
                    } else {
                        this.isResting = false;
                        this.round++;
                        this.timeLeft = this.roundTime;
                        document.getElementById('round-txt').textContent = `Round ${this.round} / ${this.totalRounds}`;
                        this.speak(`Round ${this.round}. Let's go!`);
                    }
                }
            }

            nextCombo() {
                if(this.isResting || !this.isRunning) return;
                
                let sequence = [];
                let p1 = this.punches[Math.floor(Math.random() * this.punches.length)];
                let p2 = this.punches[Math.floor(Math.random() * this.punches.length)];
                sequence.push(p1, p2);

                let comboStr = `${p1.label} ➔ ${p2.label}`;
                let speechStr = `${p1.say}, ${p2.say}`;

                if(Math.random() > 0.45) {
                    let def = this.defenses[Math.floor(Math.random() * this.defenses.length)];
                    sequence.push(def);
                    comboStr += ` + ${def.label}`;
                    speechStr += `, ${def.say}`;
                }

                document.getElementById('combo-text').textContent = comboStr;
                document.getElementById('combo-sub').textContent = 'Execute combination';

                this.speak(speechStr);

                // تنفيذ الحركات بالتسلسل الزمني المتطابق مع النطق
                sequence.forEach((step, idx) => {
                    setTimeout(() => {
                        if (this.isRunning && !this.isResting) {
                            triggerMove3D(step.anim);
                        }
                    }, idx * 520);
                });
            }

            speak(text) {
                if (window.AndroidTTS) {
                    window.AndroidTTS.speak(text);
                } else if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.rate = 1.2; u.pitch = 0.9;
                    window.speechSynthesis.speak(u);
                }
            }

            renderTimer() {
                let m = Math.floor(this.timeLeft / 60);
                let s = this.timeLeft % 60;
                document.getElementById('timer-display').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => { new BoxingProEngine(); });
    </script>
</body>
</html>
