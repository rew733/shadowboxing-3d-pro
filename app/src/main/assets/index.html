<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxing Coach Pro 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #070b14;
            --panel: #111827;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --danger: #ef4444;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }
        header { text-align: center; margin-bottom: 6px; }
        header h1 { font-size: 1.1rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .app-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
        
        #canvas-3d { width: 100%; height: 200px; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(0,0,0,0.6); position: relative; overflow: hidden; }

        .panel { background: var(--panel); border-radius: 16px; padding: 14px; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .status-board { display: flex; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
        .timer-sec { text-align: center; margin: 4px 0; }
        .timer-sec h2 { font-size: 2.6rem; font-weight: 900; color: var(--text); text-shadow: 0 0 15px var(--accent-glow); }
        
        .combo-box { background: rgba(245, 158, 11, 0.05); border: 2px dashed var(--accent); border-radius: 12px; padding: 12px; text-align: center; min-height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .combo-box h3 { font-size: 1.7rem; color: var(--accent); font-weight: 900; letter-spacing: 1px; }
        .combo-box p { font-size: 0.75rem; color: var(--muted); margin-top: 3px; text-transform: uppercase; }

        .controls { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        button { background: var(--accent); color: #000; border: none; padding: 12px; font-size: 0.95rem; font-weight: 800; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        button:active { transform: scale(0.97); }
        button.secondary { background: #1f2937; color: var(--text); border: 1px solid var(--border); }

        .settings { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: var(--muted); }
        .row { display: flex; justify-content: space-between; align-items: center; }
        select, input { background: #1f2937; border: 1px solid var(--border); color: white; padding: 5px 8px; border-radius: 6px; outline: none; }
    </style>
</head>
<body>

    <header><h1>Boxing Coach Pro • 3D Flow</h1></header>

    <div class="app-container">
        <div id="canvas-3d"></div>

        <div class="panel">
            <div class="status-board">
                <span id="round-txt">Round 1 / 3</span>
                <span style="color: var(--accent);">Mode: 3D Pro</span>
            </div>
            <div class="timer-sec"><h2 id="timer-display">03:00</h2></div>
            <div class="combo-box">
                <h3 id="combo-text">READY</h3>
                <p id="combo-sub">Follow 3D motion & audio</p>
            </div>
        </div>

        <div class="panel settings">
            <div class="row">
                <label>Rounds / Duration:</label>
                <div>
                    <select id="rounds-select"><option value="3">3R</option><option value="5">5R</option><option value="12">12R</option></select>
                    <select id="time-select"><option value="180">3m</option><option value="120">2m</option></select>
                </div>
            </div>
            <div class="row">
                <label>Combo Speed:</label>
                <input type="range" id="speed-range" min="2" max="5" value="3.5" step="0.5">
            </div>
        </div>

        <div class="controls">
            <button id="start-btn">Start Session</button>
            <button class="secondary" onclick="location.reload()">Reset</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, boxerGroup, leftArm, rightArm;
        let isPunching = false;

        function init3D() {
            const container = document.getElementById('canvas-3d');
            if (typeof THREE === 'undefined') return;
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 4.8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const pLight = new THREE.PointLight(0xf59e0b, 2, 10);
            pLight.position.set(2, 3, 2);
            scene.add(pLight);

            boxerGroup = new THREE.Group();
            const matBody = new THREE.MeshPhongMaterial({ color: 0x1e293b });
            const matSkin = new THREE.MeshPhongMaterial({ color: 0xd97706 });
            const matGloves = new THREE.MeshPhongMaterial({ color: 0xef4444 });

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.2, 1.0, 8), matBody);
            torso.position.y = -0.1;
            boxerGroup.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), matSkin);
            head.position.set(0.08, 0.7, 0);
            boxerGroup.add(head);

            leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.65, 0.1), matBody);
            leftArm.position.set(-0.28, 0.2, 0.25);
            leftArm.rotation.x = -0.3;
            boxerGroup.add(leftArm);
            const lg = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), matGloves);
            lg.position.set(0, -0.3, 0.35);
            leftArm.add(lg);

            rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.65, 0.1), matBody);
            rightArm.position.set(0.25, 0.2, -0.05);
            rightArm.rotation.x = -0.5;
            rightArm.rotation.y = -0.3;
            boxerGroup.add(rightArm);
            const rg = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), matGloves);
            rg.position.set(-0.1, -0.3, 0.3);
            rightArm.add(rg);

            boxerGroup.position.set(0, -0.3, 0);
            scene.add(boxerGroup);
            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if(boxerGroup && !isPunching) {
                boxerGroup.position.y = -0.3 + Math.sin(Date.now() * 0.006) * 0.015;
            }
            if(renderer && scene && camera) renderer.render(scene, camera);
        }

        function triggerPunch3D(isLeft) {
            if (!leftArm || !rightArm) return;
            isPunching = true;
            let arm = isLeft ? leftArm : rightArm;
            let origZ = arm.position.z;
            let startTime = Date.now();
            
            function step() {
                let elapsed = Date.now() - startTime;
                if(elapsed < 120) {
                    arm.position.z += 0.035;
                    requestAnimationFrame(step);
                } else if(elapsed < 250) {
                    arm.position.z -= 0.035;
                    requestAnimationFrame(step);
                } else {
                    arm.position.z = origZ;
                    isPunching = false;
                }
            }
            step();
        }

        window.addEventListener('load', init3D);

        class BoxingProEngine {
            constructor() {
                this.punches = [
                    { name: '1 (Jab)', code: 'Jab', isLeft: true },
                    { name: '2 (Cross)', code: 'Cross', isLeft: false },
                    { name: '3 (Lead Hook)', code: 'Lead Hook', isLeft: true },
                    { name: '4 (Rear Uppercut)', code: 'Rear Uppercut', isLeft: false }
                ];
                this.defenses = ['Slip Left', 'Slip Right', 'Roll'];
                
                this.isRunning = false;
                this.round = 1;
                this.totalRounds = 3;
                this.roundTime = 180;
                this.restTime = 60;
                this.timeLeft = this.roundTime;
                this.isResting = false;
                this.speed = 3500;
                this.initListeners();
            }

            initListeners() {
                document.getElementById('start-btn').addEventListener('click', () => this.toggle());
                document.getElementById('speed-range').addEventListener('input', (e) => {
                    this.speed = parseFloat(e.target.value) * 1000;
                });
                document.getElementById('rounds-select').addEventListener('change', (e) => {
                    this.totalRounds = parseInt(e.target.value);
                    document.getElementById('round-txt').textContent = `Round ${this.round} / ${this.totalRounds}`;
                });
                document.getElementById('time-select').addEventListener('change', (e) => {
                    this.roundTime = parseInt(e.target.value);
                    if(!this.isRunning) { this.timeLeft = this.roundTime; this.renderTimer(); }
                });
            }

            toggle() {
                if(this.isRunning) { this.stop(); } else { this.start(); }
            }

            start() {
                this.isRunning = true;
                const btn = document.getElementById('start-btn');
                btn.textContent = 'Stop Session';
                btn.style.background = 'var(--danger)';
                btn.style.color = '#fff';

                this.timer = setInterval(() => this.tick(), 1000);
                this.loop = setInterval(() => this.nextCombo(), this.speed);
                this.speak("Round 1. Fight!");
            }

            stop() {
                this.isRunning = false;
                clearInterval(this.timer);
                clearInterval(this.loop);
                const btn = document.getElementById('start-btn');
                btn.textContent = 'Start Session';
                btn.style.background = 'var(--accent)';
                btn.style.color = '#000';
                document.getElementById('combo-text').textContent = 'READY';
            }

            tick() {
                if(this.timeLeft > 0) {
                    this.timeLeft--;
                    this.renderTimer();
                } else {
                    if(!this.isResting) {
                        if(this.round >= this.totalRounds) {
                            this.stop();
                            this.speak("Workout complete!");
                            return;
                        }
                        this.isResting = true;
                        this.timeLeft = this.restTime;
                        document.getElementById('combo-text').textContent = 'REST';
                        document.getElementById('combo-sub').textContent = 'Breathe & recover';
                        this.speak("Rest time.");
                    } else {
                        this.isResting = false;
                        this.round++;
                        this.timeLeft = this.roundTime;
                        document.getElementById('round-txt').textContent = `Round ${this.round} / ${this.totalRounds}`;
                        this.speak(`Round ${this.round}. Let's go!`);
                    }
                }
            }

            nextCombo() {
                if(this.isResting || !this.isRunning) return;
                
                let p1 = this.punches[Math.floor(Math.random() * this.punches.length)];
                let p2 = this.punches[Math.floor(Math.random() * this.punches.length)];
                let comboStr = `${p1.name} ➔ ${p2.name}`;

                if(Math.random() > 0.5) {
                    let def = this.defenses[Math.floor(Math.random() * this.defenses.length)];
                    comboStr += ` + ${def}`;
                }

                document.getElementById('combo-text').textContent = comboStr;
                document.getElementById('combo-sub').textContent = 'Execute combination';

                triggerPunch3D(p1.isLeft);
                this.speak(p1.code);
            }

            speak(text) {
                if (window.AndroidTTS) {
                    window.AndroidTTS.speak(text);
                } else if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.rate = 1.2; u.pitch = 0.9;
                    window.speechSynthesis.speak(u);
                }
            }

            renderTimer() {
                let m = Math.floor(this.timeLeft / 60);
                let s = this.timeLeft % 60;
                document.getElementById('timer-display').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => { new BoxingProEngine(); });
    </script>
</body>
</html>
