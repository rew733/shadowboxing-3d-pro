<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boxing Coach Pro</title>
    
    <!-- مكتبات MediaPipe الأساسية -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- مكتبة Three.js (إذا كنت تستخدمها) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* إعدادات الخلفية العامة المتوافقة مع MainActivity */
        body {
            background-color: #070b14;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* حاوية الكاميرا والرسوميات */
        #vision-container {
            position: relative;
            width: 100%;
            height: 40vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* وسم Canvas لعرض كفوف المدرب أو 3D */
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* واجهة المستخدم والتحكم */
        #ui-controls {
            flex: 1;
            padding: 20px;
            background-color: #111827;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            overflow-y: auto;
        }

        .btn-start {
            background-color: #10b981;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            padding: 15px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }

        .btn-camera {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- ========================================== -->
        <!-- 1. الحاوية الرسومية والكاميرا المخفية        -->
        <!-- ========================================== -->
        <div id="vision-container">
            <!-- الكاميرا: هذا السطر إجباري كما هو لمنع الشاشة السوداء في الـ WebView -->
            <video id="webcam" autoplay muted playsinline style="display: none;"></video>
            
            <!-- لوحة الرسم التي سيظهر عليها التتبع أو الـ 3D -->
            <canvas id="output_canvas"></canvas>
        </div>

        <!-- ========================================== -->
        <!-- 2. واجهة التطبيق (أزرارك وقوائمك)          -->
        <!-- ========================================== -->
        <div id="ui-controls">
            <!-- ضع تصميم الأزرار والكومبوهات الخاص بك هنا -->
            
            <button class="btn-camera" onclick="startCamera()">📷 تفعيل الكاميرا (Kalman)</button>
            <button class="btn-start" onclick="startTraining()">🥊 ابدأ تمرين كف المدرب</button>
            
            <div id="status-text" style="text-align: center; margin-top: 10px; color: #9ca3af;">جاهز للبدء...</div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. كود الجافاسكربت الأساسي والمحمي بالكامل  -->
    <!-- ========================================== -->
    <script>
        let poseWorker = null;
        let isCameraActive = false;

        // ----------------------------------------------------
        // أ. تهيئة الـ Web Worker (Kalman Filter) للحماية من التعليق
        // ----------------------------------------------------
        function initPoseWorker() {
            try {
                const workerCode = `
                    class KalmanFilter1D {
                        constructor(q = 0.02, r = 0.12) {
                            this.q = q; this.r = r; this.x = 0; this.p = 1; this.initialized = false;
                        }
                        filter(measurement) {
                            if (!this.initialized) { this.x = measurement; this.initialized = true; return this.x; }
                            this.p = this.p + this.q;
                            const k = this.p / (this.p + this.r);
                            this.x = this.x + k * (measurement - this.x);
                            this.p = (1 - k) * this.p;
                            return this.x;
                        }
                    }
                    const kfNose = { x: new KalmanFilter1D(), y: new KalmanFilter1D() };
                    const kfLWrist = { x: new KalmanFilter1D(), y: new KalmanFilter1D() };
                    const kfRWrist = { x: new KalmanFilter1D(), y: new KalmanFilter1D() };

                    self.onmessage = function(e) {
                        try {
                            const arr = new Float32Array(e.data);
                            if (arr.length < 10) return;
                            
                            // تنعيم الإحداثيات باستخدام مرشح كالمان
                            const nX = kfNose.x.filter(arr[0]), nY = kfNose.y.filter(arr[1]);
                            const lShY = arr[3], rShY = arr[5];
                            const lWY = kfLWrist.y.filter(arr[7]), rWY = kfRWrist.y.filter(arr[9]);
                            
                            const shoulderAvgY = (lShY + rShY) / 2;
                            const guardDown = (lWY > shoulderAvgY + 0.09) || (rWY > shoulderAvgY + 0.09);

                            self.postMessage({
                                type: 'KALMAN_RESULT',
                                guardDown: guardDown,
                                nose: { x: nX, y: nY },
                                leftWrist: { x: arr[6], y: lWY },
                                rightWrist: { x: arr[8], y: rWY }
                            });
                        } catch(err) {}
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                poseWorker = new Worker(URL.createObjectURL(blob));
                
                poseWorker.onmessage = function(e) {
                    if (e.data.type === 'KALMAN_RESULT') {
                        // هنا يتم استلام البيانات المنعمة.. يمكنك ربطها بحركة الـ 3D أو الكاونتر
                        // console.log("Guard Down?", e.data.guardDown);
                    }
                };
                console.log("تم تفعيل Web Worker بنجاح.");
            } catch (e) {
                console.warn("فشل تفعيل Web Worker: وضع الطوارئ يعمل.");
            }
        }

        // ----------------------------------------------------
        // ب. تشغيل الكاميرا (بطريقة تمنع الشاشة السوداء)
        // ----------------------------------------------------
        async function startCamera() {
            if (isCameraActive) return;
            
            const videoElement = document.getElementById('webcam');
            if (!videoElement) return;

            // إجبار المتصفح على تقبل التشغيل في الخلفية بصمت لمنع حظر أندرويد
            videoElement.setAttribute('autoplay', '');
            videoElement.setAttribute('muted', '');
            videoElement.setAttribute('playsinline', '');

            try {
                document.getElementById('status-text').innerText = "جاري تشغيل الكاميرا...";
                
                // طلب الكاميرا بمرونة لتجنب رفض الهاتف
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });

                videoElement.srcObject = stream;
                await videoElement.play();
                isCameraActive = true;
                document.getElementById('status-text').innerText = "الكاميرا نشطة. جاري تشغيل الذكاء الاصطناعي...";
                
                // تشغيل MediaPipe بعد أن تتأكد من اشتغال الكاميرا بنجاح
                startMediaPipe(videoElement);
            } catch (err) {
                console.error("خطأ في تشغيل الكاميرا:", err);
                alert("يرجى إعطاء صلاحية الكاميرا للتطبيق للتمكن من التدريب.");
                document.getElementById('status-text').innerText = "فشل تشغيل الكاميرا.";
            }
        }

        // ----------------------------------------------------
        // ج. تشغيل MediaPipe Pose وإرسال البيانات للـ Worker
        // ----------------------------------------------------
        function startMediaPipe(videoElement) {
            if (typeof Pose === 'undefined') {
                console.error("مكتبة Pose لم يتم تحميلها بعد.");
                return;
            }

            const pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            
            camera.start().then(() => {
                document.getElementById('status-text').innerText = "النظام جاهز للتتبع 🎯";
            });
        }

        // معالجة إحداثيات MediaPipe ونقلها بنظام Zero-Copy للـ Worker
        function onPoseResults(results) {
            if (!results.poseLandmarks || !poseWorker) return;
            
            const lm = results.poseLandmarks;
            const arr = new Float32Array(10);
            
            arr[0] = lm[0].x;  arr[1] = lm[0].y;   // الأنف
            arr[2] = lm[11].x; arr[3] = lm[11].y;  // الكتف الأيسر
            arr[4] = lm[12].x; arr[5] = lm[12].y;  // الكتف الأيمن
            arr[6] = lm[15].x; arr[7] = lm[15].y;  // المعصم الأيسر
            arr[8] = lm[16].x; arr[9] = lm[16].y;  // المعصم الأيمن

            // إرسال المصفوفة للـ Worker بشكل سريع جداً دون استهلاك الذاكرة
            poseWorker.postMessage(arr.buffer, [arr.buffer]);
            
            // يمكنك هنا إضافة رسم النقاط (Draw) على الكانفاس (output_canvas)
        }

        // ----------------------------------------------------
        // د. تهيئة الملف عند الفتح
        // ----------------------------------------------------
        window.onload = () => {
            initPoseWorker();
            // التهيئة الأولية لأي أكواد Three.js تضعها هنا
        };

        function startTraining() {
            if(!isCameraActive) {
                alert("قم بتفعيل الكاميرا أولاً!");
                return;
            }
            // استدعاء دالة الكومبوهات والجولات الخاصة بك هنا
        }
    </script>
</body>
</html>
