<!-- قسم الاسبارنج التفاعلي المعزول (لا يمس أي تبويب سابق) -->
    <div id="sec-sparring" class="main-section">
        <div class="panel" style="border-color: rgba(245, 158, 11, 0.35);">
            <div class="timer-hero" style="padding: 8px 12px; margin-bottom: 8px; border-color: rgba(245, 158, 11, 0.25);">
                <div class="round-info">
                    <strong id="sparring-round-label">اسبارنج تفاعلي</strong>
                    <span id="sparring-phase-badge" style="color: var(--accent);">IDLE STANCE</span>
                </div>
                <div class="timer" id="sparring-timer-display" style="font-size: 1.65rem;">03:00</div>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 6px; margin-bottom: 8px;">
                <button class="btn secondary small" id="sparring-cam-btn" style="border-color: var(--neon); color: var(--neon);" onclick="toggleSparringCamera()">📷 كاميرا الاسبارنج</button>
                <button class="btn secondary small" onclick="calibrateSparringStance()">🎯 معايرة</button>
            </div>

            <div class="stick-box" id="sparring-cue-box" style="border-color: var(--accent); background: rgba(245, 158, 11, 0.07);">
                <div class="stick-move-title" id="sparring-opp-action" style="color: #fcd34d;">⚔️ INTERACTIVE SPARRING</div>
                <div class="stick-dodge-cue" id="sparring-player-cue">اضغط ابدأ لمواجهة الخصم عبر الكاميرا</div>
                <div class="stick-sub-hint" id="sparring-sub-hint">تفادَ هجوم الخصم أولاً ثم سدد الكاونتر في نافذة الرد</div>
            </div>

            <div class="score-grid">
                <div class="score-card"><span>نقاطك</span><strong id="sparring-score" style="color: var(--success);">0</strong></div>
                <div class="score-card"><span>تفادي / كاونتر</span><strong id="sparring-player-hits" style="color: var(--neon);">0</strong></div>
                <div class="score-card"><span>إصابات الخصم</span><strong id="sparring-opp-hits" style="color: var(--danger);">0</strong></div>
            </div>
        </div>

        <div class="main-btns">
            <button class="btn" id="sparring-start-btn" style="background: var(--accent); color: #000;" onclick="toggleSparringSession()">⚔️ ابدأ الاسبارنج</button>
            <button class="btn secondary" onclick="resetSparringSession()">إعادة</button>
        </div>
    </div>
